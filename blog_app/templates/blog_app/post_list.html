<h1>Блог</h1>
<a href="{% url 'blog_app:post_create' %}">Создать новую запись</a>
<ul>
  {% for post in posts %}
    <li>
      <h2><a href="{% url 'blog_app:post_detail' post.pk %}">{{ post.title }}</a></h2>
      <p>{{ post.content|truncatewords:30 }}</p>
      <small>Опубликовано: {{ post.created_at|date:"d.m.Y H:i" }}</small>
    </li>
  {% endfor %}
</ul>
