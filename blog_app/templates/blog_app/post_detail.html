<h1>{{ post.title }}</h1>
{% if post.preview_image %}
  <img src="{{ post.preview_image.url }}" alt="{{ post.title }}" style="max-width: 500px;">
{% endif %}
<p>{{ post.content }}</p>
<small>Просмотров: {{ post.views_count }}</small>
<p>
  <a href="{% url 'blog_app:post_update' post.pk %}">Редактировать</a> |
  <a href="{% url 'blog_app:post_delete' post.pk %}">Удалить</a>
</p>
