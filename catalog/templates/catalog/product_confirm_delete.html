% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>Подтверждение удаления</h1>
    <p>Вы уверены, что хотите удалить продукт <strong>"{{ product.name }}"</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <p class="text-muted">Описание: {{ product.description|truncatechars:100 }}</p>
        <p class="text-muted">Цена: {{ product.price }} руб.</p>

        <div class="mt-4">
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'products:product_list' %}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
